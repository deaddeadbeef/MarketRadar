name: product-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff discovery surface
        run: >
          python -m ruff check
          src/catalyst_radar/discovery/join.py
          src/catalyst_radar/discovery/ready.py
          src/catalyst_radar/discovery/persist.py
          src/catalyst_radar/discovery/yaml_util.py
          tests/unit/test_discovery_join.py
          tests/unit/test_discovery_ready.py
      - name: Product tests
        env:
          PYTHONPATH: src
        run: >
          python -m pytest
          tests/unit/test_discovery_*.py
          tests/unit/test_product_scope.py
          -q

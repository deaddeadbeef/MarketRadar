# DEPRECATED: Tauri World Events is not the product receive surface.
# Use catalyst-radar / grok -p "/market-radar hunt". Not required to run the product.
[package]
name = "radar-desktop"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
radar-tui = { path = "../../crates/radar-tui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
